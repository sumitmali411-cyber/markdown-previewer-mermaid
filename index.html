<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown + Mermaid Viewer</title>

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="toolbar">
    <div class="left-tools">
        <input type="file" id="fileInput" accept=".md" hidden />
        <button id="uploadBtn">Upload .md</button>
        <select id="mermaidVersion">
            <option value="10.8.0">Mermaid 10.8.0</option>
            <option value="11.2.0">Mermaid 11.2.0</option>
            <option value="11.3.0">Mermaid 11.3.0</option>
            <option value="11.4.0">Mermaid 11.4.0</option>
            <option value="latest" selected>Latest</option>
        </select>
        <button id="toggleRaw">Toggle Raw</button>
    </div>
    <div class="right-tools">
        <button id="themeToggle">Theme</button>
    </div>
</header>

<main class="container">
    <div id="dropZone" class="preview-pane">
        <div id="preview"></div>
    </div>
    <textarea id="rawMarkdown" class="raw-pane hidden"></textarea>
</main>

<div id="processingIndicator" class="processing-indicator hidden" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true">
    <span class="spinner" aria-hidden="true"></span>
    <span id="processingText">Processing...</span>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
